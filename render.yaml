services:
  # Single Real Moodle LMS Server with local_webmcp baked in + persistent SQLite database
  - type: web
    name: moodle-webmcp
    env: docker
    dockerfilePath: ./moodle/Dockerfile
    plan: starter
    region: oregon
    disk:
      name: moodledata
      mountPath: /var/www/moodledata
      sizeGB: 5
    envVars:
      - key: SITE_URL
        sync: false
      - key: DB_TYPE
        value: sqlite3
      - key: MOODLE_DATABASE_TYPE
        value: sqlite3
      - key: DB_SQLITE_PATH
        value: /var/www/moodledata/sqlite/moodle.sqlite
      - key: MOODLE_USERNAME
        value: admin
      - key: MOODLE_PASSWORD
        value: MoodleWebMCP2026!
      - key: MOODLE_EMAIL
        value: admin@apex.edu
      - key: MOODLE_SITENAME
        value: Moodle_WebMCP_University

