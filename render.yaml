services:
  # Moodle WebMCP: Single Real Moodle LMS Server with native WebMCP plugin & persistent SQLite storage
  - type: web
    name: moodle-webmcp
    env: docker
    dockerfilePath: ./moodle/Dockerfile
    plan: starter
    region: oregon
    disk:
      name: moodledata
      mountPath: /var/www/moodledata
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8080"
      - key: SSLPROXY
        value: "true"
      - key: REVERSEPROXY
        value: "true"
      - key: SITE_URL
        sync: false # Set in Render to https://moodle-webmcp.akashgpt.me or your preferred domain
      - key: DB_TYPE
        value: sqlite3
      - key: MOODLE_DATABASE_TYPE
        value: sqlite3
      - key: DB_SQLITE_PATH
        value: /var/www/moodledata/sqlite/moodle.sqlite
      - key: MOODLE_USERNAME
        value: admin
      - key: MOODLE_PASSWORD
        value: MoodleWebMCP2026!
      - key: MOODLE_EMAIL
        value: admin@apex.edu
      - key: MOODLE_SITENAME
        value: Moodle_WebMCP_University

