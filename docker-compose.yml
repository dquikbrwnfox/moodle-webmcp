version: '3.8'

services:
  moodle:
    build:
      context: .
      dockerfile: moodle/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SITE_URL: http://localhost:8080
      DB_TYPE: sqlite3
      MOODLE_DATABASE_TYPE: sqlite3
      DB_SQLITE_PATH: /var/www/moodledata/sqlite/moodle.sqlite
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: MoodleWebMCP2026!
      MOODLE_EMAIL: admin@apex.edu
      MOODLE_SITENAME: "Moodle WebMCP University"
    volumes:
      - moodledata:/var/www/moodledata

volumes:
  moodledata:

