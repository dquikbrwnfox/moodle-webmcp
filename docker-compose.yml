version: '3.8'

services:
  moodle-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodlepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  moodle:
    build:
      context: .
      dockerfile: moodle/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SITE_URL: http://localhost:8080
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: 5432
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodlepassword123
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: MoodleWebMCP2026!
      MOODLE_EMAIL: admin@apex.edu
      MOODLE_SITENAME: "Moodle WebMCP University"
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      - moodle-db

volumes:
  postgres_data:
  moodledata:



